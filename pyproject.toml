[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portscanlab"
version = "1.0.0"
description = "Detection lab for identifying Nmap-like recon activity from firewall logs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
port-scan-lab = "main:main"
